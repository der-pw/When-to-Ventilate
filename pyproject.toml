[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-when-to-ventilate"
version = "0.1.4"
description = "Home Assistant custom integration for room ventilation recommendations"
readme = "README.md"
requires-python = ">=3.13.2"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant",
  "pytest",
  "pytest-homeassistant-custom-component==0.13.356",
  "pytest-cov",
  "ruff"
]

[tool.setuptools]
# The Home Assistant integration is installed by copying custom_components;
# this project metadata is used only to provide the development dependencies.
packages = []

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.when_to_ventilate"]
